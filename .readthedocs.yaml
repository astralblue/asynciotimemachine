# Read the Docs configuration.  Required in-repo since 2023.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

python:
  install:
    # Runs `uv sync --group docs` against the committed uv.lock, so Read the
    # Docs builds with exactly the Sphinx a local build uses.  This installs
    # the project itself too, which matters: docs/conf.py imports
    # asynciotimemachine for __version__.  Only one entry is allowed when the
    # method is `uv`.
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  # The build is warning-free as of 0.4.0; keep it that way.
  fail_on_warning: true
